<!doctype html>
<html lang="ru">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="theme-color" content="#1b1019">
	<title>Комплимент для Ксюши</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="style.css">
	<link rel="stylesheet" href="mini-app.css">
</head>
<body>
	<header class="topbar page">
		<a class="brand" href="sute.html"><span class="brand-mark" aria-hidden="true">К.</span><span>Ксюша</span></a>
	</header>
	<main>
		<section class="subpage-hero page">
			<div class="eyebrow">Сообщение // доставить улыбку</div>
			<h1>Ксюша,<br><span>ты топ-1!</span></h1>
			<p class="hero-copy">За доброту, чувство юмора и тот самый вайб. Официальная печать вселенной прилагается.</p>
		</section>
		<section class="contact page page-cta">
			<div>
				<div class="section-kicker">Комплимент дня</div>
				<h2>С тобой даже обычный день становится классным.</h2>
				<p class="copy-status" id="copy-status" role="status" aria-live="polite"></p>
			</div>
			<button class="button copy-button" id="copy-compliment" type="button">Скопировать комплимент <span aria-hidden="true">↗</span></button>
		</section>
	</main>
	<nav class="mini-tabs" aria-label="Разделы приложения">
		<a class="mini-tab" href="sute.html"><span class="mini-tab-icon" aria-hidden="true">⌂</span><span>Главная</span></a>
		<a class="mini-tab" href="about.html"><span class="mini-tab-icon" aria-hidden="true">◎</span><span>Ксюша</span></a>
		<a class="mini-tab" href="facts.html"><span class="mini-tab-icon" aria-hidden="true">✦</span><span>Факты</span></a>
		<a class="mini-tab" aria-current="page" href="contact.html"><span class="mini-tab-icon" aria-hidden="true">♡</span><span>Комплимент</span></a>
	</nav>
	<footer class="page">
		<a class="brand" href="sute.html"><span class="brand-mark" aria-hidden="true">К.</span><span>Ксюша</span></a>
		<span class="footer-note">© <span class="year"></span> Ксюша · Топ-1 без конкурса</span>
	</footer>
	<script>document.querySelectorAll(".year").forEach((item) => item.textContent = new Date().getFullYear());</script>
	<script>
		const copyButton = document.getElementById("copy-compliment");
		const copyStatus = document.getElementById("copy-status");
		copyButton.addEventListener("click", async () => {
			const compliment = "Ксюша, с тобой даже обычный день становится классным. Ты топ-1!";
			try {
				await navigator.clipboard.writeText(compliment);
			} catch {
				const temporaryInput = document.createElement("textarea");
				temporaryInput.value = compliment;
				temporaryInput.style.position = "fixed";
				temporaryInput.style.opacity = "0";
				document.body.append(temporaryInput);
				temporaryInput.select();
				document.execCommand("copy");
				temporaryInput.remove();
			}
			copyStatus.textContent = "Скопировано. Улыбка уже в пути.";
		});
	</script>
	<script src="https://telegram.org/js/telegram-web-app.js" defer></script>
	<script src="mini-app.js" defer></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" defer></script>
	<script src="three-background.js" defer></script>
	<script src="cursor.js" defer></script>
</body>
</html>
